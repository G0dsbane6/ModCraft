services:
  - type: web
    name: modcraft
    runtime: docker
    repo: https://github.com/G0dsbane6/ModCraft
    plan: free
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      # Public Google OAuth client ID (from the Google Cloud OAuth consent screen)
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: ""